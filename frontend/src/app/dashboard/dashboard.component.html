<h2>Lista de órdenes</h2>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Título</th>
      <th>Descripción</th>
      <th>Monto</th>
      <th>Estado</th>
      <th>Factura</th>
      <th>Creado por</th>
      <th>Fecha</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let order of orders">
      <td>{{order.id}}</td>
      <td>{{order.title}}</td>
      <td>{{order.description}}</td>
      <td>{{order.amount}}</td>
      <td>{{order.status}}</td>

      <td>
        <a [href]="order.invoice_url" target="_blank">Ver PDF</a>
      </td>

      <td>{{order.created_by}}</td>
      <td>{{order.created_date}}</td>
    </tr>
  </tbody>
</table>
