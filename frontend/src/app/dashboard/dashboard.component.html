<div class="dashboard-wrapper">
  <!-- Barra superior -->
  <div class="topbar">
    <div class="logo">Sistema de Órdenes</div>
    <div class="user-actions">
      <button class="logout-btn" (click)="logout()">Salir</button>
    </div>
  </div>

  <!-- Contenido -->
  <div class="green-container">
    <div class="table-container">
      <h2>Lista de órdenes</h2>
      <table class="styled-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Descripción</th>
            <th>Monto</th>
            <th>Estado</th>
            <th>Factura</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let order of orders">
            <td>{{ order.id }}</td>
            <td>{{ order.title }}</td>
            <td class="desc">{{ order.description }}</td>
            <td>${{ order.amount }}</td>
            <td>
              <span class="status" [ngClass]="order.status.toLowerCase()">
                {{ order.status }}
              </span>
            </td>
            <td>
              <ng-container *ngIf="order.invoiceUrl; else noFile">
                <button (click)="openFile(order.invoiceUrl)">Ver</button>
                <button (click)="downloadFile(order.invoiceUrl)">Descargar</button>
              </ng-container>
              <ng-template #noFile>No hay</ng-template>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Modal para visor de archivos -->
<div *ngIf="isViewerOpen" class="viewer-modal">
  <div class="viewer-content">
    <button class="close-btn" (click)="closeViewer()">✖ Cerrar</button>
    <iframe *ngIf="pdfBlobUrl" [src]="pdfBlobUrl" width="100%" height="600px"></iframe>
  </div>
</div>

    <!-- Visor de archivo -->
    <div *ngIf="pdfBlobUrl" class="viewer-container">
      <button (click)="closeViewer()">Cerrar Visor</button>
      <iframe [src]="pdfBlobUrl" width="100%" height="600px"></iframe>
    </div>
  </div>
</div>
