<div class="operator-wrapper">
  <div class="card">
    <h2>Crear Nueva Orden</h2>
    <p class="subtitle">Ingresa la información de la orden de pago</p>

    <form (ngSubmit)="createOrder()" #orderForm="ngForm">

      <div class="form-group">
        <label>Título</label>
        <input type="text" [(ngModel)]="order.title" name="title" required placeholder="Ej: Pago proveedor"/>
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea rows="4" [(ngModel)]="order.description" name="description" required placeholder="Descripción..."></textarea>
      </div>

      <div class="form-group">
        <label>Monto</label>
        <input type="number" [(ngModel)]="order.amount" name="amount" required placeholder="Ej: 1500"/>
      </div>

      <div class="form-group">
        <label>Factura (PDF)</label>
        <input type="file" (change)="onFileSelected($event)" accept=".pdf"/>
      </div>

      <button type="submit" [disabled]="orderForm.invalid">Crear Orden</button>
    </form>
  </div>
</div>
